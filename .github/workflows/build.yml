name: Build ESP32-CAM Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 Core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://github.io
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.1.1

      - name: Compile Sketch
        run: |
          mkdir -p build
          arduino-cli compile \
            --fqbn esp32:esp32:esp32cam:PartitionScheme=min_spiffs \
            --output-dir build \
            ESP32-CAM_MJPEG2SD.ino

      - name: Upload Compiled Firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32cam-telegram-firmware
          path: build/*.bin
