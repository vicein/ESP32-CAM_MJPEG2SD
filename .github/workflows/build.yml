name: Build ESP32-CAM Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Arduino CLI & ESP32 Core
        run: |
          curl -fsSL https://githubusercontent.com | sh
          export PATH=$PATH:$PWD/bin
          ESP_URL="https://github.io"
          arduino-cli core update-index --additional-urls "$ESP_URL"
          arduino-cli core install esp32:esp32@3.1.1 --additional-urls "$ESP_URL"

      - name: Compile Sketch
        run: |
          export PATH=$PATH:$PWD/bin
          mkdir -p build
          arduino-cli compile \
            --fqbn esp32:esp32:esp32cam:PartitionScheme=min_spiffs \
            --output-dir build \
            ESP32-CAM_MJPEG2SD.ino

      - name: Upload Compiled Firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32cam-telegram-firmware
          path: build/*.bin
